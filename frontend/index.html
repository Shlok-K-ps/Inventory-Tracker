<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Supply Chain Inventory Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
  
  .topbar { background: #1a1a2e; border-bottom: 2px solid #e63946; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
  .topbar h1 span { color: #e63946; }
  .live-badge { display: flex; align-items: center; gap: 8px; background: #1e1e38; border: 1px solid #2a2a4a; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #2dc653; }
  .live-dot { width: 8px; height: 8px; background: #2dc653; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .main { padding: 28px 32px; }

  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 20px 24px; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .kpi.total::before { background: #4a4aff; }
  .kpi.reorder::before { background: #e63946; }
  .kpi.ok::before { background: #2dc653; }
  .kpi .val { font-size: 36px; font-weight: 700; color: #fff; }
  .kpi.reorder .val { color: #e63946; }
  .kpi.ok .val { color: #2dc653; }
  .kpi .lbl { font-size: 11px; color: #666; margin-top: 6px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

  .section { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  .section-header { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .section-header .ai-badge { background: #1e1e38; border: 1px solid #4a4aff; color: #7878ff; padding: 2px 8px; border-radius: 10px; font-size: 10px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  input { background: #0f0f1a; border: 1px solid #2a2a4a; color: #e0e0e0; padding: 11px 14px; border-radius: 8px; font-size: 13px; width: 100%; font-family: 'Space Grotesk', sans-serif; transition: border-color 0.2s; }
  input:focus { outline: none; border-color: #e63946; }
  input::placeholder { color: #444; }
  .btn-primary { background: #e63946; color: #fff; border: none; padding: 11px 24px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.5px; transition: background 0.2s; }
  .btn-primary:hover { background: #c1121f; }

  table { width: 100%; border-collapse: collapse; }
  th { background: #12122a; color: #555; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 16px; text-align: left; }
  td { padding: 14px 16px; font-size: 13px; border-top: 1px solid #1e1e38; color: #bbb; }
  tr:hover td { background: #1e1e38; }
  .sku-name { color: #fff; font-weight: 600; }

  .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  .badge-ok { background: #0a2e14; color: #2dc653; border: 1px solid #1a5c28; }
  .badge-reorder { background: #2e0a0a; color: #e63946; border: 1px solid #5c1a1a; }

  .qty-input { background: #0f0f1a; border: 1px solid #2a2a4a; color: #e0e0e0; padding: 7px 10px; border-radius: 6px; font-size: 12px; width: 75px; font-family: 'Space Grotesk', sans-serif; }
  .qty-input:focus { outline: none; border-color: #e63946; }
  .btn-sm { background: transparent; border: 1px solid #2a2a4a; color: #888; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s; margin-right: 6px; }
  .btn-sm:hover { border-color: #e63946; color: #e63946; }
  .btn-del { color: #444; }
  .btn-del:hover { border-color: #e63946; color: #e63946; }

  .empty { text-align: center; padding: 48px; color: #444; font-size: 13px; }
  .empty span { display: block; font-size: 32px; margin-bottom: 12px; }

  /* ── AI CHAT ── */
  .chat-messages { max-height: 320px; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat-messages:empty::before { content: 'Ask me anything about your inventory! Try: "Which items need reordering?" or "Summarize my stock levels."'; color: #444; font-size: 13px; font-style: italic; }
  .msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 85%; }
  .msg.user { background: #e63946; color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg.ai { background: #12122a; border: 1px solid #2a2a4a; color: #ccc; align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.ai.thinking { color: #555; font-style: italic; }
  .chat-input-row { display: flex; gap: 10px; }
  .chat-input-row input { flex: 1; }
  .btn-ai { background: #4a4aff; color: #fff; border: none; padding: 11px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: background 0.2s; white-space: nowrap; }
  .btn-ai:hover { background: #3333cc; }
  .btn-ai:disabled { background: #2a2a4a; color: #555; cursor: not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Supply Chain <span>//</span> Inventory Tracker</h1>
  <div class="live-badge"><div class="live-dot"></div> LIVE</div>
</div>

<div class="main">
  <div class="kpi-row">
    <div class="kpi total">
      <div class="val" id="k-total">0</div>
      <div class="lbl">Total SKUs</div>
    </div>
    <div class="kpi reorder">
      <div class="val" id="k-reorder">0</div>
      <div class="lbl">Reorder Required</div>
    </div>
    <div class="kpi ok">
      <div class="val" id="k-ok">0</div>
      <div class="lbl">Stock Healthy</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">Add SKU</div>
    <div class="form-grid">
      <input type="text" id="name" placeholder="Product / SKU name" />
      <input type="number" id="quantity" placeholder="Current qty" />
      <input type="number" id="threshold" placeholder="Reorder threshold" />
      <input type="text" id="supplier" placeholder="Supplier (optional)" />
    </div>
    <button class="btn-primary" onclick="addProduct()">+ Add to Inventory</button>
  </div>

  <div class="section">
    <div class="section-header">Inventory</div>
    <table>
      <thead>
        <tr>
          <th>Product / SKU</th>
          <th>Supplier</th>
          <th>Qty in Stock</th>
          <th>Reorder At</th>
          <th>Status</th>
          <th>Update Qty</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- AI CHAT SECTION -->
  <div class="section">
    <div class="section-header">
      🤖 AI Inventory Assistant
      <span class="ai-badge">Powered by Gemini</span>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Ask about your inventory..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button class="btn-ai" id="chat-btn" onclick="sendChat()">Ask AI</button>
    </div>
  </div>
</div>

<script>
const API = 'https://inventory-tracker-production-c9c7.up.railway.app';
const GEMINI_KEY = 'AIzaSyBJm0FIys6qVsuT1fH8hil6VVmcinpxacU';

let inventoryData = [];

async function load() {
  try {
    const r = await fetch(`${API}/products`);
    const ps = await r.json();
    inventoryData = ps;
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    let rc = 0;
    if (ps.length === 0) {
      tb.innerHTML = '<tr><td colspan="7" class="empty"><span>📦</span>No SKUs yet. Add your first product above.</td></tr>';
    }
    ps.forEach(p => {
      if (p.reorder_needed) rc++;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="sku-name">${p.name}</td>
        <td>${p.supplier || '—'}</td>
        <td>${p.quantity}</td>
        <td>${p.threshold}</td>
        <td><span class="badge ${p.reorder_needed ? 'badge-reorder' : 'badge-ok'}">${p.reorder_needed ? '⚠ REORDER' : '✔ OK'}</span></td>
        <td><input class="qty-input" type="number" id="q${p.id}" value="${p.quantity}" /></td>
        <td>
          <button class="btn-sm" onclick="upd(${p.id})">Update</button>
          <button class="btn-sm btn-del" onclick="del(${p.id})">Delete</button>
        </td>`;
      tb.appendChild(tr);
    });
    const t = ps.length, ok = t - rc;
    document.getElementById('k-total').innerText = t;
    document.getElementById('k-reorder').innerText = rc;
    document.getElementById('k-ok').innerText = ok;
  } catch(e) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="empty"><span>⚠️</span>Backend not reachable.</td></tr>';
  }
}

async function addProduct() {
  const name = document.getElementById('name').value.trim();
  const quantity = parseFloat(document.getElementById('quantity').value);
  const threshold = parseFloat(document.getElementById('threshold').value);
  const supplier = document.getElementById('supplier').value.trim();
  if (!name || isNaN(quantity) || isNaN(threshold)) return alert('Fill in name, quantity and threshold.');
  await fetch(`${API}/products`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, quantity, threshold, supplier })
  });
  ['name','quantity','threshold','supplier'].forEach(id => document.getElementById(id).value = '');
  load();
}

async function upd(id) {
  const qty = parseFloat(document.getElementById('q' + id).value);
  await fetch(`${API}/products/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ quantity: qty })
  });
  load();
}

async function del(id) {
  if (!confirm('Remove this SKU?')) return;
  await fetch(`${API}/products/${id}`, { method: 'DELETE' });
  load();
}

// ── GEMINI CHAT ──
function addMessage(text, role) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-btn');
  const question = input.value.trim();
  if (!question) return;

  input.value = '';
  btn.disabled = true;
  addMessage(question, 'user');

  const thinking = addMessage('Thinking...', 'ai thinking');

  // Build inventory context for Gemini
  let context = 'You are an AI assistant for a Supply Chain Inventory Tracker. ';
  if (inventoryData.length > 0) {
    context += `Current inventory data: ${JSON.stringify(inventoryData.map(p => ({
      name: p.name,
      quantity: p.quantity,
      threshold: p.threshold,
      supplier: p.supplier || 'N/A',
      status: p.reorder_needed ? 'NEEDS REORDER' : 'OK'
    })))}. `;
  } else {
    context += 'The inventory is currently empty. ';
  }
  context += 'Answer the user question based on this data. Be concise and helpful.';

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: context + '\n\nUser question: ' + question }]
          }]
        })
      }
    );
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not get a response.';
    thinking.className = 'msg ai';
    thinking.textContent = reply;
  } catch(e) {
    thinking.className = 'msg ai';
    thinking.textContent = 'Error reaching Gemini. Check your API key.';
  }

  btn.disabled = false;
}

load();
</script>
</body>
</html>
